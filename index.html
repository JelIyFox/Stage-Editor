<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>PE Stage Editor</title>
<style>
:root{--bg:#14151c;--p:#1d1f2a;--p2:#2a2d3d;--ac:#7b8cde;--tx:#e8e9f0;--mut:#8b8fa3;--bad:#ff6b6b;--warn:#ffcc4d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.35 system-ui,-apple-system,Roboto,sans-serif;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100dvh;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--p)}
header h1{font-size:14px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{background:var(--p2);color:var(--tx);border:0;border-radius:8px;padding:8px 11px;font:inherit}
button:active{filter:brightness(1.25)}
button.pri{background:var(--ac);color:#fff}
button.bad{background:#5a2a33}
#stageWrap{position:relative;flex:0 0 46%;min-height:120px;background:#0d0e13;touch-action:none;overflow:hidden}
#stageWrap.big{flex-basis:72%}
#cv{display:block;touch-action:none}
#ov{position:absolute;right:6px;top:6px;display:flex;flex-direction:column;gap:6px}
#ov button{width:38px;height:38px;padding:0;background:rgba(40,43,60,.85);font-size:17px}
#ov button.on{background:var(--ac)}
#toast{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.75);padding:5px 10px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:70%}
#toast.on{opacity:1}
nav{display:flex;background:var(--p);overflow-x:auto}
nav button{flex:1 0 auto;border-radius:0;background:none;padding:10px 12px;font-size:13px;color:var(--mut);border-bottom:2px solid transparent;white-space:nowrap}
nav button.on{color:var(--tx);border-bottom-color:var(--ac)}
#panel{flex:1;overflow:auto;padding:4px 10px 40px;-webkit-overflow-scrolling:touch}
.f{display:flex;flex-direction:column;gap:2px;margin:5px 0;font-size:12px;color:var(--mut)}
.f input,.f select{background:#0f1016;border:1px solid #333851;color:var(--tx);border-radius:7px;padding:8px;font:inherit;font-size:14px;width:100%}
.f input[type=range]{padding:0;height:28px}
.f.c{flex-direction:row;align-items:center;gap:8px;color:var(--tx);font-size:14px}
.f.c input{width:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grp{background:var(--p);border-radius:12px;padding:6px 10px 8px;margin:8px 0}
.grp h3{margin:4px 0 2px;font-size:13px;color:var(--ac)}
.item{display:flex;align-items:center;gap:6px;background:var(--p);border-radius:10px;padding:8px;margin:5px 0;border:1px solid transparent}
.item.on{border-color:var(--ac)}
.item small{color:var(--mut);margin-left:4px}
.item button{padding:5px 9px}
.sp{flex:1}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0;align-items:center}
.hint{color:var(--mut);font-size:12px;margin:6px 0}
.warn{color:var(--warn);font-size:13px;margin:3px 0}
.act{background:var(--p2);border-radius:10px;padding:4px 10px 8px;margin:8px 0}
pre{background:#0b0c10;border-radius:8px;padding:8px;overflow:auto;font-size:11px;max-height:340px;white-space:pre}
.fxgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}
.fxgrid button{text-align:left;padding:9px 10px;line-height:1.25}
.fxgrid button small{display:block;color:var(--mut);font-size:11px;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:5px;max-height:132px;overflow:auto;margin:6px 0}
.chips button{padding:5px 9px;font-size:12px}
.hl{animation:hl 2s}
@keyframes hl{from{box-shadow:0 0 0 3px var(--ac)}to{box-shadow:0 0 0 3px transparent}}
.f textarea{background:#0f1016;border:1px solid #333851;color:var(--tx);border-radius:7px;padding:8px;font:12px/1.4 ui-monospace,Consolas,monospace;width:100%;white-space:pre;overflow:auto;resize:vertical;tab-size:2}
.pin{flex:1;min-width:0;background:#0f1016;border:1px solid #333851;color:var(--tx);border-radius:7px;padding:8px;font:inherit}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>PE Stage Editor · 0.7.3</h1>
    <button id="bUndo">↶</button><button id="bRedo">↷</button>
    <button id="bPlay" class="pri">▶</button><button id="bReset">⟲</button>
  </header>
  <div id="stageWrap">
    <canvas id="cv"></canvas>
    <div id="ov">
      <button id="bFit">⌂</button><button id="bZin">＋</button><button id="bZout">−</button>
      <button id="bSnap">⌗</button><button id="bBig">⤢</button>
    </div>
    <div id="toast"></div>
  </div>
  <nav id="tabs">
    <button data-tab="objects">Объекты</button><button data-tab="props">Свойства</button>
    <button data-tab="fx">✨ Эффекты</button><button data-tab="events">События</button><button data-tab="stage">Сцена</button><button data-tab="import">🔄 Импорт</button><button data-tab="export">Экспорт</button>
  </nav>
  <section id="panel"></section>
</div>
<input type="file" id="fImg" accept="image/*,.xml,text/xml,application/xml" multiple hidden>
<input type="file" id="fXml" hidden>
<input type="file" id="fSnd" accept="audio/*,.ogg" multiple hidden>
<input type="file" id="fProj" hidden>
<input type="file" id="fLib" hidden>
<input type="file" id="fCv" accept=".json,.xml,text/xml,application/json,text/plain" hidden>
<input type="file" id="fCvImg" accept="image/*,.xml,text/xml" multiple hidden>
<datalist id="dlSnd"></datalist>

<script>
'use strict';
/* ================= утилиты ================= */
const $=s=>document.querySelector(s);
let _id=Date.now()%1e6; const uid=()=>++_id;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R=(n,d=2)=>Math.round(n*Math.pow(10,d))/Math.pow(10,d);
const rint=(a,b)=>{a=Math.round(a);b=Math.round(b);if(b<a)[a,b]=[b,a];return a+Math.floor(Math.random()*(b-a+1));};
const EASES={linear:t=>t,quadIn:t=>t*t,quadOut:t=>t*(2-t),quadInOut:t=>t<.5?2*t*t:-1+(4-2*t)*t,sineInOut:t=>-(Math.cos(Math.PI*t)-1)/2,cubeOut:t=>1-Math.pow(1-t,3),backOut:t=>1+2.70158*Math.pow(t-1,3)+1.70158*Math.pow(t-1,2),bounceOut:t=>{const n=7.5625,d=2.75;if(t<1/d)return n*t*t;if(t<2/d)return n*(t-=1.5/d)*t+.75;if(t<2.5/d)return n*(t-=2.25/d)*t+.9375;return n*(t-=2.625/d)*t+.984375;}};
const EASE_NAMES=Object.keys(EASES);

/* ================= проект ================= */
function defProject(){return{v:1,name:'mystage',mod:'mymod',bpm:120,
  stage:{speed:1,zoom:.9,pixel:false,hideGF:false,camSpeed:1,bf:[770,100],gf:[400,130],dad:[100,100],camBF:[0,0],camDad:[0,0],camGF:[0,0]},
  objects:[],events:[],lua:[],images:{},sounds:{}};}
function newObj(o){return Object.assign({id:uid(),tag:'obj',type:'image',image:'',x:0,y:0,sx:1,sy:1,scrollX:1,scrollY:1,alpha:1,angle:0,flipX:false,front:false,visible:true,locked:false,aa:true,blend:'normal',color:'FFFFFF',w:200,h:200,animated:false,anims:[],defAnim:'',fx:[],cam:'game'},o||{});}
const animLua=p=>String(p||'').replace(/[^A-Za-z0-9_]+/g,'_').replace(/^_+|_+$/g,'')||'anim';
const mkAnim=p=>({name:animLua(p),prefix:p,fps:24,loop:true,ox:0,oy:0});
function newEvent(o){return Object.assign({id:uid(),name:'Событие',trig:{type:'beat',n:4,off:0,chance:100,start:4,gapMin:8,gapMax:24},actions:[]},o||{});}
function newAct(type,o){return Object.assign({type,delay:0,target:'',prop:'alpha',value:1,dur:1,ease:'linear',x1:0,y1:0,x2:0,y2:0,hide:true,color:'FFFFFF',cam:'camGame',intensity:.01,sound:'',vol:1,anim:'',code:''},o||{});}
let P=defProject();
let SEL=null,tab='objects',uni=true,snap=false,viewCode=null;
const objById=id=>P.objects.find(o=>String(o.id)===String(id));
const evById=id=>P.events.find(e=>String(e.id)===String(id));
const selObj=()=>objById(SEL);
const CH={bf:{s:[190,390],c:'#31b0d1',n:'BF'},dad:{s:[190,390],c:'#af66ce',n:'Оппонент'},gf:{s:[230,360],c:'#c2185b',n:'GF'}};
const isChar=k=>k==='bf'||k==='gf'||k==='dad';
function uniqTag(b){b=(b||'obj').replace(/[^A-Za-z0-9_]/g,'_');let t=b,k=2;while(P.objects.some(o=>o.tag===t))t=b+'_'+(k++);return t;}

/* ================= undo / автосохранение ================= */
let prevSer='';const undoS=[],redoS=[];
const ser=()=>JSON.stringify({n:P.name,m:P.mod,b:P.bpm,s:P.stage,o:P.objects,e:P.events,l:P.lua});
function commit(){const s=ser();if(s===prevSer)return;undoS.push(prevSer);if(undoS.length>60)undoS.shift();redoS.length=0;prevSer=s;saveSoon();}
function restore(s){prevSer=s;const d=JSON.parse(s);P.name=d.n;P.mod=d.m;P.bpm=d.b;P.stage=d.s;P.objects=d.o;P.events=d.e;P.lua=d.l||[];if(!isChar(SEL)&&!selObj())SEL=null;resetSim();renderPanel();invalidate();saveSoon();}
function undo(){if(!undoS.length)return toast('Нечего отменять');redoS.push(prevSer);restore(undoS.pop());}
function redo(){if(!redoS.length)return;undoS.push(prevSer);restore(redoS.pop());}
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('pestage',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function dbSet(k,v){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});}
async function dbGet(k){const db=await idb();return new Promise((res,rej)=>{const r=db.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
let saveT=0;function saveSoon(){clearTimeout(saveT);saveT=setTimeout(()=>{dbSet('proj',JSON.stringify(P)).catch(()=>{});},700);}

/* ================= картинки / атласы ================= */
const IMG={};
function prepImage(name){return new Promise(res=>{const d=P.images[name];if(!d)return res();const el=new Image();el.onload=()=>{const c=IMG[name]={el,frames:{},prefixes:[],list:[]};d.w=el.naturalWidth;d.h=el.naturalHeight;if(d.xml){try{parseXml(d.xml,c);}catch(e){}}invalidate();res();};el.onerror=()=>res();el.src=d.data;});}
function parseXml(txt,c){const doc=new DOMParser().parseFromString(txt,'text/xml');c.list=[...doc.getElementsByTagName('SubTexture')].map(s=>{const g=k=>parseFloat(s.getAttribute(k));return{n:s.getAttribute('name'),x:g('x'),y:g('y'),w:g('width'),h:g('height'),fx:g('frameX')||0,fy:g('frameY')||0,fw:g('frameWidth')||g('width'),fh:g('frameHeight')||g('height')};});const set=new Set();c.list.forEach(f=>set.add(f.n.replace(/\d{4}$/,'')));c.prefixes=[...set];}
function framesFor(img,prefix,idx){const c=IMG[img];if(!c)return[];if(!c.frames[prefix])c.frames[prefix]=c.list.filter(f=>f.n.startsWith(prefix)).sort((a,b)=>a.n<b.n?-1:1);const fr=c.frames[prefix];return idx&&typeof idxFrames==='function'?idxFrames(fr,idx):fr;}
function dim(o){if(o.type==='rect')return{w:o.w,h:o.h};const d=P.images[o.image];if(!d)return{w:100,h:100};if(o.animated&&o.anims.length){const da=o.anims.find(a=>a.name===o.defAnim)||o.anims[0];const f=framesFor(o.image,da.prefix,da.idx)[0];if(f)return{w:f.fw,h:f.fh};}return{w:d.w||100,h:d.h||100};}
const cleanName=n=>n.replace(/[^\w.\-]+/g,'_');
const readFile=(f,as)=>new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r[as==='text'?'readAsText':'readAsDataURL'](f);});
async function importImages(files){
  const list=[...files],xmls=list.filter(f=>/\.xml$/i.test(f.name)),imgs=list.filter(f=>!/\.xml$/i.test(f.name));
  if(!imgs.length&&xmls.length)return toast('XML добавляй на вкладке ✨ Эффекты у выбранного объекта');
  const added=[];
  for(const f of imgs){const name=cleanName(f.name);const data=await readFile(f);P.images[name]={data,w:0,h:0,xml:(P.images[name]||{}).xml||null};
    const x=xmls.find(z=>noExt(cleanName(z.name))===noExt(name));if(x)P.images[name].xml=await readFile(x,'text');
    await prepImage(name);added.push(name);}
  const c=V2W();let k=0;
  added.forEach(n=>{const d=P.images[n],ci=IMG[n];const o=newObj({tag:uniqTag(n.replace(/\.[^.]+$/,'')),image:n,x:R(c.x-d.w/2+k*30),y:R(c.y-d.h/2+k*30)});
    if(d.xml&&ci&&ci.prefixes.length){o.animated=true;o.anims.push(mkAnim(ci.prefixes[0]));}
    P.objects.push(o);SEL=o.id;k++;});
  commit();tab='props';setTab();toast('Добавлено: '+added.length);
}
async function attachXml(f){const o=selObj();if(!o||o.type!=='image'||!o.image)return toast('Выбери объект с картинкой');const txt=await readFile(f,'text');P.images[o.image].xml=txt;await prepImage(o.image);const c=IMG[o.image];if(!c||!c.prefixes.length)return toast('В XML нет SubTexture');o.animated=true;if(!o.anims.length)o.anims.push(mkAnim(c.prefixes[0]));commit();renderPanel();invalidate();toast('Атлас: анимаций '+c.prefixes.length);}
async function importSounds(files){for(const f of files){const name=cleanName(f.name);P.sounds[name]={data:await readFile(f)};}saveSoon();renderPanel();toast('Звуки добавлены');}

/* ================= симуляция предпросмотра ================= */
let playing=false,simT=0,RT={},tweens=[],sched=[],EVS={},fx={flash:null,shake:null},lastB=-1,lastS=-1,lastC=-1,dirty=true;
const invalidate=()=>{dirty=true;};
const rt=o=>RT[o.id]||(RT[o.id]={});
let liveAnim=false;
const fxt=()=>simT*(+P.stage.speed||1);
function selAnimated(){const o=selObj();return !!(o&&o.animated&&o.anims.length);}
function resetSim(){RT={};tweens.length=0;sched.length=0;EVS={};fx.flash=null;fx.shake=null;simT=0;lastB=lastS=lastC=-1;liveAnim=false;invalidate();}
function cur(o,p){const r=RT[o.id];if(r&&r[p]!==undefined)return r[p];return p==='visible'?(o.visible?1:0):o[p];}
function ev(o){
  const r=RT[o.id]||{};let x=r.x!==undefined?r.x:o.x,y=r.y!==undefined?r.y:o.y,a=r.alpha!==undefined?r.alpha:o.alpha,ang=r.angle!==undefined?r.angle:o.angle,vis=r.visible!==undefined?!!r.visible:o.visible,sm=1;
  if(playing){
    const t=fxt(),fr=v=>((v%1)+1)%1,S2=Math.PI*2;let mx=0,my=0,mr=0,ma=1,ms=1,hm=0,hr=0,ha=0;
    (o.fx||[]).forEach(f=>{const ph=t/Math.max(.01,+f.period||1)+(+f.phase||0);
      if(f.type==='move'){hm=1;if(f.mode==='pingpong'){const k=.5-.5*Math.cos(S2*ph);mx+=f.dx*k;my+=f.dy*k;}else if(f.mode==='circle'){mx+=f.dx*Math.cos(S2*ph);my+=f.dy*Math.sin(S2*ph);}else{const k=fr(ph);mx+=f.dx*k;my+=f.dy*k;}}
      else if(f.type==='rotate'){hr=1;mr+=f.mode==='swing'?(f.amp||0)*Math.sin(S2*ph):(f.rev?-360:360)*fr(ph);}
      else if(f.type==='alpha'){ha=1;ma*=f.mode==='blink'?(fr(ph)<.5?f.max:f.min):f.min+(f.max-f.min)*(.5-.5*Math.cos(S2*ph));}
      else if(f.type==='size'){ms*=1+f.amt*Math.sin(S2*ph);}
    });
    if(hm){x=o.x+mx;y=o.y+my;}if(hr)ang=o.angle+mr;if(ha)a=ma;sm=ms;
  }
  return{x,y,a,ang,vis,sm};
}
function addTween(o,prop,to,dur,ease,hide){tweens=tweens.filter(w=>!(w.o===o&&w.prop===prop));tweens.push({o,prop,from:cur(o,prop),to:+to,t0:simT,dur:Math.max(.001,+dur||.001),ease:EASES[ease]||EASES.linear,hide});}
function doAction(a){
  const o=objById(a.target);
  switch(a.type){
    case'flash':fx.flash={c:String(a.color||'FFFFFF').replace('#',''),dur:Math.max(.05,+a.dur||.5),t0:simT};break;
    case'shake':fx.shake={i:+a.intensity||.01,until:simT+(+a.dur||.3)};break;
    case'sound':playSnd(a.sound,a.vol);break;
    case'anim':if(o){const r=rt(o);r.animName=a.anim;r.animT0=simT;liveAnim=true;}break;
    case'set':if(o)rt(o)[a.prop]=+a.value;break;
    case'tween':if(o)addTween(o,a.prop,a.value,a.dur,a.ease);break;
    case'lua':toast('Lua-код выполняется только в игре');break;
    case'run':if(o){const r=rt(o);r.x=+a.x1;r.y=+a.y1;r.visible=true;addTween(o,'x',a.x2,a.dur,'linear',a.hide);addTween(o,'y',a.y2,a.dur,'linear');}break;
  }
  invalidate();
}
function runEvent(e){e.actions.forEach(a=>{const d=+a.delay||0;if(d>0)sched.push({at:simT+d,a});else doAction(a);});}
function playSnd(name,vol){const s=P.sounds[name];if(s){try{const au=new Audio(s.data);au.volume=clamp(+vol||1,0,1);au.play().catch(()=>{});}catch(e){}}toast('🔊 '+(name||'звук'));}
function trigHit(c,t){const n=Math.max(1,t.n|0);return c%n===(((t.off|0)%n)+n)%n&&Math.random()*100<(t.chance==null?100:t.chance);}
function fire(type,c){P.events.forEach(e=>{const t=e.trig;if(t.type===type)if(trigHit(c,t))runEvent(e);});}
function tickBeats(){
  const bf=simT*P.bpm/60,b=Math.floor(bf);
  while(lastB<b){lastB++;
    P.events.forEach(e=>{const t=e.trig;if(t.type==='random'){const st=EVS[e.id]||(EVS[e.id]={ready:t.start});if(lastB>=st.ready&&Math.random()*100<t.chance){st.ready=lastB+rint(t.gapMin,t.gapMax);runEvent(e);}}});
    fire('beat',lastB);}
  const s=Math.floor(bf*4);while(lastS<s){lastS++;fire('step',lastS);}
  const c=Math.floor(b/4);while(lastC<c){lastC++;fire('section',lastC);}
}
function runSched(){for(let i=sched.length-1;i>=0;i--)if(simT>=sched[i].at){const a=sched[i].a;sched.splice(i,1);doAction(a);}}
function runTweens(){for(let i=tweens.length-1;i>=0;i--){const w=tweens[i];const k=clamp((simT-w.t0)/w.dur,0,1);rt(w.o)[w.prop]=w.from+(w.to-w.from)*w.ease(k);if(k>=1){if(w.hide)rt(w.o).visible=false;tweens.splice(i,1);}}}
function togglePlay(){if(!playing){resetSim();playing=true;}else{playing=false;resetSim();}$('#bPlay').textContent=playing?'⏸':'▶';invalidate();}

/* ================= холст ================= */
const cv=$('#cv'),ctx=cv.getContext('2d');let W=300,H=300,dpr=1,V={x:640,y:360,z:.4};
function resize(){const r=$('#stageWrap').getBoundingClientRect();W=r.width;H=r.height;dpr=window.devicePixelRatio||1;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);cv.style.width=W+'px';cv.style.height=H+'px';invalidate();}
new ResizeObserver(resize).observe($('#stageWrap'));
const s2w=(px,py)=>({x:(px-W/2)/V.z+V.x,y:(py-H/2)/V.z+V.y});
const V2W=()=>({x:V.x,y:V.y});
function fit(){V.x=640;V.y=360;V.z=clamp(W/1500,.05,4);invalidate();}
const BLEND={normal:'source-over',add:'lighter',multiply:'multiply',screen:'screen'};
function drawGrid(){
  const step=V.z<.15?1000:V.z<.35?500:100;const x0=Math.floor((V.x-W/2/V.z)/step)*step,x1=V.x+W/2/V.z,y0=Math.floor((V.y-H/2/V.z)/step)*step,y1=V.y+H/2/V.z;
  ctx.lineWidth=1/V.z;ctx.strokeStyle='rgba(255,255,255,.06)';ctx.beginPath();
  for(let x=x0;x<=x1;x+=step){ctx.moveTo(x,y0);ctx.lineTo(x,y1);}for(let y=y0;y<=y1;y+=step){ctx.moveTo(x0,y);ctx.lineTo(x1,y);}ctx.stroke();

  for(let i=L.length-1;i>=0;i--){const b=boxOf(L[i]);if(b&&p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h)return L[i];}return null;}

  if(isChar(id)){const a=q('stage',id+'.0'),b=q('stage',id+'.1');if(a)a.value=x;if(b)b.value=y;}else{const a=q('obj','x'),b=q('obj','y');if(a)a.value=x;if(b)b.value=y;}}

    else pan={x:e.offsetX,y:e.offsetY,vx:V.x,vy:V.y};}

function cloneRetarget(e,selfId){const c=jc(e);delete c.id;c.actions.forEach(a=>{a.target=selfId!=null&&String(a.target)===String(selfId)?'@self':'';});return c;}
function applyCombo(it){
  const o=selObj();
  const needs=it.fx.length>0||it.events.some(e=>e.actions.some(a=>a.target==='@self'))||it.lua.some(l=>l.target==='@self');
  if(needs&&!o)return toast('Сначала выбери объект');
  if(o)it.fx.forEach(f=>o.fx.push(jc(f)));
  it.events.forEach(e=>{const c=Object.assign(newEvent(),jc(e));c.id=uid();c.trig=TR(c.trig);c.actions=c.actions.map(a=>Object.assign(newAct(a.type),a));c.actions.forEach(a=>{if(a.target==='@self')a.target=o?o.id:'';});P.events.push(c);});
  it.lua.forEach(l=>{const c=Object.assign(newLua(),jc(l));c.id=uid();c.target=c.target==='@self'&&o?o.id:'';P.lua.push(c);});
  commit();resetSim();renderPanel();invalidate();toast('Применено: '+it.name);
}

function actLines(a,id,tg,twc){
  const o=objById(a.target),t=o?q(tg[o.id]):null,need=['anim','set','tween','run'].includes(a.type);
  if(need&&!o)return null;
  const prop={x:'X',y:'Y',alpha:'Alpha',angle:'Angle'};
  switch(a.type){
    case'lua':{const c=subst(a.code,o?tg[o.id]:null,id,a.params||[]);if(!c.trim())return null;return['do',...c.split('\n').map(l=>'\t'+l.replace(/\s+$/,'')),'end'];}
    case'flash':return[`cameraFlash(${q(a.cam)}, ${q(hex(a.color))}, ${N(a.dur)}, true)`];
    case'shake':return[`cameraShake(${q(a.cam)}, ${N(a.intensity)}, ${N(a.dur)})`];
    case'sound':{if(!a.sound)return null;const p=P.sounds[a.sound]?imgPath(a.sound):noExt(a.sound);return[`playSound(${q(p)}, ${N(a.vol)})`];}
    case'anim':return a.anim?[`objectPlayAnimation(${t}, ${q(a.anim)}, true)`]:null;
    case'set':return a.prop==='visible'?[`setProperty(${q(tg[o.id]+'.visible')}, ${+a.value>.5})`]:[`setProperty(${q(tg[o.id]+'.'+a.prop)}, ${N(a.value)})`];
    case'tween':return[`doTween${prop[a.prop]}(${q(id)}, ${t}, ${N(a.value)}, ${N(a.dur)}, ${q(a.ease)})`];
    case'run':{const L=[`setProperty(${q(tg[o.id]+'.x')}, ${N(a.x1)})`,`setProperty(${q(tg[o.id]+'.y')}, ${N(a.y1)})`,`setProperty(${q(tg[o.id]+'.visible')}, true)`,`doTweenX(${q(id+'_x')}, ${t}, ${N(a.x2)}, ${N(a.dur)}, 'linear')`,`doTweenY(${q(id+'_y')}, ${t}, ${N(a.y2)}, ${N(a.dur)}, 'linear')`];if(a.hide)twc.push([id+'_x',[`setProperty(${q(tg[o.id]+'.visible')}, false)`]]);return L;}
  }
  return null;
}
function subst(code,tag,id,params){
  const pm={};(params||[]).forEach(p=>{if(p&&p.k)pm[String(p.k)]=p.v;});
  return String(code==null?'':code).replace(/\{(\w+)\}/g,(m,k)=>{
    if(k==='obj')return tag!=null?tag:m;
    if(k==='id')return String(id);
    if(Object.prototype.hasOwnProperty.call(pm,k))return String(pm[k]);
    return m;});
}
function luaBalance(code){
  const s=String(code||''),n=s.length;let i=0,out='';
  while(i<n){const c=s[i];
    if(c==='-'&&s[i+1]==='-'){const m=/^--\[(=*)\[/.exec(s.slice(i,i+40));
      if(m){const close=']'+m[1]+']';const j=s.indexOf(close,i+m[0].length);i=j<0?n:j+close.length;}
      else{const j=s.indexOf('\n',i);i=j<0?n:j;}
      out+=' ';continue;}
    if(c==='['){const m=/^\[(=*)\[/.exec(s.slice(i,i+40));
      if(m){const close=']'+m[1]+']';const j=s.indexOf(close,i+m[0].length);i=j<0?n:j+close.length;out+=' "" ';continue;}}
    if(c==='"'||c==="'"){let j=i+1;while(j<n&&s[j]!==c&&s[j]!=='\n'){if(s[j]==='\\')j++;j++;}i=j+1;out+=' "" ';continue;}
    out+=c;i++;}
  const words=out.match(/[A-Za-z_][A-Za-z0-9_]*/g)||[];let open=0,rep=0;
  words.forEach(w=>{if(w==='function'||w==='if'||w==='do')open++;else if(w==='end')open--;else if(w==='repeat')rep++;else if(w==='until')rep--;});
  const cnt=ch=>out.split(ch).length-1;
  if(open>0)return'не хватает '+open+' × end';
  if(open<0)return'лишний end ('+(-open)+')';
  if(rep!==0)return'repeat/until не сходятся';
  if(cnt('(')!==cnt(')'))return'скобки ( ) не сходятся';
  if(cnt('{')!==cnt('}'))return'скобки { } не сходятся';
  return'';
}
function objCreate(o,tag,x,y){
  const L=[],t=q(tag);
  if(o.type==='rect')L.push(`\tmakeLuaSprite(${t}, '', ${N(x)}, ${N(y)})`,`\tmakeGraphic(${t}, ${Math.round(o.w)}, ${Math.round(o.h)}, ${q(hex(o.color))})`);
  else if(o.animated&&o.anims.length){
    L.push(`\tmakeAnimatedLuaSprite(${t}, ${q(imgPath(o.image))}, ${N(x)}, ${N(y)})`);
    o.anims.forEach(a=>{L.push(a.idx&&idxList(a.idx).length?`\taddAnimationByIndices(${t}, ${q(a.name)}, ${q(a.prefix)}, ${q(idxList(a.idx).join(','))}, ${N(a.fps)}, ${!!a.loop})`:`\taddAnimationByPrefix(${t}, ${q(a.name)}, ${q(a.prefix)}, ${N(a.fps)}, ${!!a.loop})`);if(a.ox||a.oy)L.push(`\taddOffset(${t}, ${q(a.name)}, ${N(a.ox||0)}, ${N(a.oy||0)})`);});
    const da=o.anims.find(a=>a.name===o.defAnim)||o.anims[0];L.push(`\tobjectPlayAnimation(${t}, ${q(da.name)}, true)`);}
  else L.push(`\tmakeLuaSprite(${t}, ${q(imgPath(o.image))}, ${N(x)}, ${N(y)})`);
  if(o.scrollX!==1||o.scrollY!==1)L.push(`\tsetScrollFactor(${t}, ${N(o.scrollX)}, ${N(o.scrollY)})`);
  if(o.sx!==1||o.sy!==1)L.push(`\tscaleObject(${t}, ${N(o.sx)}, ${N(o.sy)}, true)`);
  if(o.alpha!==1)L.push(`\tsetProperty(${q(tag+'.alpha')}, ${N(o.alpha)})`);
  if(o.angle)L.push(`\tsetProperty(${q(tag+'.angle')}, ${N(o.angle)})`);
  if(o.flipX)L.push(`\tsetProperty(${q(tag+'.flipX')}, true)`);
  if(!o.visible)L.push(`\tsetProperty(${q(tag+'.visible')}, false)`);
  if(!o.aa)L.push(`\tsetProperty(${q(tag+'.antialiasing')}, false)`);
  if(o.blend!=='normal')L.push(`\tsetBlendMode(${t}, ${q(o.blend)})`);
  if(o.cam&&o.cam!=='game')L.push(`\tsetObjectCamera(${t}, ${q(o.cam)})`);
  L.push(`\taddLuaSprite(${t}, ${!!o.front})`);
  return L;
}
/* постоянные эффекты объекта: все складываются (move/rotate: сумма, alpha/size: произведение) */
function fxLines(o,cp,Wx,Wy){
  const fx=o.fx||[];if(!fx.length)return[];
  const B=[`local x, y, ang, al, sc = ${N(o.x)}, ${N(o.y)}, ${N(o.angle)}, 1, 1`],ch={x:0,y:0,a:0,l:0,s:0};let tx=false,ty=false;
  fx.forEach((f,i)=>{
    const k='k'+i,ph=`fxT / ${N(Math.max(.01,+f.period||1))} + ${N(f.phase||0)}`;
    if(f.type==='move'){ch.x=ch.y=1;
      if(f.mode==='pingpong')B.push(`local ${k} = 0.5 - 0.5 * math.cos(2 * math.pi * (${ph}))`,`x = x + ${N(f.dx)} * ${k}`,`y = y + ${N(f.dy)} * ${k}`);
      else if(f.mode==='circle')B.push(`local ${k} = 2 * math.pi * (${ph})`,`x = x + ${N(f.dx)} * math.cos(${k})`,`y = y + ${N(f.dy)} * math.sin(${k})`);
      else B.push(`local ${k} = (${ph}) % 1`,`x = x + ${N(f.dx)} * ${k}`,`y = y + ${N(f.dy)} * ${k}`);}
    else if(f.type==='rotate'){ch.a=1;
      if(f.mode==='swing')B.push(`ang = ang + ${N(f.amp||0)} * math.sin(2 * math.pi * (${ph}))`);
      else B.push(`ang = ang + ${f.rev?'-':''}360 * ((${ph}) % 1)`);}
    else if(f.type==='alpha'){ch.l=1;
      if(f.mode==='blink')B.push(`al = al * (((${ph}) % 1 < 0.5) and ${N(f.max)} or ${N(f.min)})`);
      else B.push(`local ${k} = 0.5 - 0.5 * math.cos(2 * math.pi * (${ph}))`,`al = al * (${N(f.min)} + (${N(f.max)} - ${N(f.min)}) * ${k})`);}
    else if(f.type==='size'){ch.s=1;B.push(`sc = sc * (1 + ${N(f.amt)} * math.sin(2 * math.pi * (${ph})))`);}
    else if(f.type==='tile'){const ay=f.axis==='y';if(ay?ty:tx)return;if(ay)ty=true;else tx=true;
      B.push(`local tk${ay?'y':'x'} = ${f.rev?'-':''}((${ph}) % 1)`);}
  });
  if(cp.length===1){
    const t=cp[0].tag;
    if(ch.x)B.push(`setProperty(${q(t+'.x')}, x)`);
    if(ch.y)B.push(`setProperty(${q(t+'.y')}, y)`);
    if(ch.a)B.push(`setProperty(${q(t+'.angle')}, ang)`);
    if(ch.l)B.push(`setProperty(${q(t+'.alpha')}, al)`);
    if(ch.s)B.push(`scaleObject(${q(t)}, ${N(o.sx)} * sc, ${N(o.sy)} * sc, false)`);
  }else{
    B.push('local cp = {'+cp.map(c=>`{${q(c.tag)}, ${c.jx}, ${c.jy}}`).join(', ')+'}','for i = 1, #cp do','\tlocal c = cp[i]');
    if(ch.x||tx)B.push(`\tsetProperty(c[1] .. '.x', ${tx?`x + (c[2] - tkx) * ${N(Wx)}`:'x'})`);
    if(ch.y||ty)B.push(`\tsetProperty(c[1] .. '.y', ${ty?`y + (c[3] - tky) * ${N(Wy)}`:'y'})`);
    if(ch.a)B.push(`\tsetProperty(c[1] .. '.angle', ang)`);
    if(ch.l)B.push(`\tsetProperty(c[1] .. '.alpha', al)`);
    if(ch.s)B.push(`\tscaleObject(c[1], ${N(o.sx)} * sc, ${N(o.sy)} * sc, false)`);
    B.push('end');
  }
  return B;
}
function genLua(){
  const tg=tagMap(),H={},evL=[],tim=[],twc=[],B=[],S=[],C=[];
  const push=(n,...ls)=>{(H[n]||(H[n]=[])).push(...ls);};
  const created=o=>o.type==='rect'||!!o.image;
  const insts=(P.lua||[]).filter(l=>l.on!==false);
  const L=['-- Сгенерировано PE Stage Editor (Psych Engine 0.7.3)','','local fxT = 0','local fxspeed = '+N(+P.stage.speed||1)];
  P.events.forEach((e,i)=>{if(e.trig.type==='random')L.push(`local ev${i+1}_ready = ${Math.round(e.trig.start)}`);});
  insts.forEach(l=>{if(String(l.top||'').trim()){const o=objById(l.target);L.push('',`-- [${String(l.name).replace(/[\r\n]+/g,' ')}] вне функций`,subst(l.top,o?tg[o.id]:null,'l'+l.id,l.params));}});
  L.push('');
  // объекты (+ копии для бесшовной прокрутки)
  const cops={};
  P.objects.forEach(o=>{
    if(!created(o))return;
    const ti=tileInfo(o),xs=ti.x?[-1,0,1]:[0],ys=ti.y?[-1,0,1]:[0],Wx=ti.x?tileW(o,ti.x):0,Wy=ti.y?tileW(o,ti.y):0,cp=[];let n=0;
    xs.forEach(jx=>ys.forEach(jy=>cp.push({tag:(jx===0&&jy===0)?tg[o.id]:tg[o.id]+'__t'+(++n),jx,jy})));
    cops[o.id]={cp,Wx,Wy};
    cp.forEach(c=>push('onCreate',...objCreate(o,c.tag,o.x+c.jx*Wx,o.y+c.jy*Wy)));
  });
  // постоянные эффекты
  if(insts.length||P.objects.some(o=>created(o)&&(o.fx||[]).length))push('onUpdate','\tfxT = fxT + elapsed * fxspeed');
  P.objects.forEach(o=>{if(!created(o))return;const c=cops[o.id],ls=fxLines(o,c.cp,c.Wx,c.Wy);
    if(ls.length)push('onUpdate',`\t-- ${tg[o.id]}`,'\tdo',...ls.map(x=>'\t\t'+x),'\tend');});
  // события
  P.events.forEach((e,i)=>{
    const en='ev'+(i+1),tr=e.trig;
    evL.push(`-- ${String(e.name).replace(/[\r\n]+/g,' ')}`,`function ${en}_fire()`);
    e.actions.forEach((a,j)=>{const id=en+'_a'+(j+1),lines=actLines(a,id,tg,twc);
      if(!lines){evL.push(`\t-- (действие ${j+1}: не настроено, пропущено)`);return;}
      if(+a.delay>0){evL.push(`\trunTimer(${q(id)}, ${N(a.delay)})`);tim.push([id,lines]);}else lines.forEach(l=>evL.push('\t'+l));});
    evL.push('end','');
    const n=Math.max(1,Math.round(tr.n)),off=((Math.round(tr.off)%n)+n)%n,ch=tr.chance<100?` and getRandomBool(${Math.round(tr.chance)})`:'';
    if(tr.type==='beat')B.push(`\tif curBeat % ${n} == ${off}${ch} then ${en}_fire() end`);
    if(tr.type==='step')S.push(`\tif curStep % ${n} == ${off}${ch} then ${en}_fire() end`);
    if(tr.type==='section')C.push(`\tif curSection % ${n} == ${off}${ch} then ${en}_fire() end`);
    if(tr.type==='random')B.push(`\tif curBeat >= ${en}_ready and getRandomBool(${Math.round(tr.chance)}) then`,`\t\t${en}_ready = curBeat + getRandomInt(${Math.round(Math.min(tr.gapMin,tr.gapMax))}, ${Math.round(Math.max(tr.gapMin,tr.gapMax))})`,`\t\t${en}_fire()`,'\tend');
  });
  if(B.length)push('onBeatHit',...B);
  if(S.length)push('onStepHit',...S);
  if(C.length)push('onSectionHit',...C);
  tim.forEach(([id,ls])=>push('onTimerCompleted',`\tif tag == ${q(id)} then`,...ls.map(x=>'\t\t'+x),'\tend'));
  twc.forEach(([id,ls])=>push('onTweenCompleted',`\tif tag == ${q(id)} then`,...ls.map(x=>'\t\t'+x),'\tend'));
  // свой Lua-код
  insts.forEach(l=>{const o=objById(l.target),tag=o?tg[o.id]:null,nm=String(l.name).replace(/[\r\n]+/g,' ');
    LHK.forEach(([h])=>{if(h==='top')return;const code=String((l.hooks||{})[h]||'');if(!code.trim())return;
      push(h,`\t-- [${nm}]`,'\tdo',...subst(code,tag,'l'+l.id,l.params).split('\n').map(x=>'\t\t'+x.replace(/\s+$/,'')),'\tend');});});
  L.push(...evL);
  ['onCreate','onSongStart','onUpdate','onBeatHit','onStepHit','onSectionHit','onEvent','onTimerCompleted','onTweenCompleted'].forEach(n=>{
    if(H[n]&&H[n].length)L.push(`function ${n}(${HARGS[n]||''})`,...H[n],'end','');});
  return L.join('\n');
}
function warnings(){
  const w=[],tags=new Set();
  P.objects.forEach(o=>{const t=lt(o.tag);if(tags.has(t))w.push('Повтор имени: '+o.tag);tags.add(t);
    if(o.type==='image'&&!o.image)w.push('У «'+o.tag+'» не выбрана картинка (в Lua пропущен)');
    if(o.animated&&o.type==='image'&&(!P.images[o.image]||!P.images[o.image].xml))w.push('У «'+o.tag+'» включена анимация, но нет XML: в игре нужен .xml рядом с .png');
    ['x','y'].forEach(ax=>{if((o.fx||[]).filter(f=>f.type==='tile'&&(f.axis==='y'?'y':'x')===ax).length>1)w.push('У «'+o.tag+'» несколько прокруток по оси '+ax.toUpperCase()+': работает только первая');});});
  P.events.forEach(e=>e.actions.forEach((a,j)=>{
    if(['anim','set','tween','run'].includes(a.type)&&!objById(a.target))w.push('«'+e.name+'»: у действия '+(j+1)+' не выбран объект');
    if(a.type==='sound'&&!a.sound)w.push('«'+e.name+'»: у действия '+(j+1)+' не задан звук');
    if(a.type==='lua'){const m=luaBalance(a.code);if(m)w.push('«'+e.name+'», Lua-код: '+m);if(/\{obj\}/.test(a.code)&&!objById(a.target))w.push('«'+e.name+'»: в Lua-коде есть {obj}, но объект не выбран');}
    const o=objById(a.target);if(o&&fxConflict(o,a))w.push('«'+e.name+'»: у объекта «'+o.tag+'» есть постоянный эффект на то же свойство, он перебьёт событие');}));
  (P.lua||[]).forEach(l=>{const hs=Object.assign({top:l.top},l.hooks||{});
    Object.keys(hs).forEach(h=>{const c=String(hs[h]||'');if(!c.trim())return;const m=luaBalance(c);if(m)w.push('Lua «'+l.name+'» ('+h+'): '+m);
      if(/\{obj\}/.test(c)&&!objById(l.target))w.push('Lua «'+l.name+'»: в коде есть {obj}, но объект не выбран');});});
  const m=luaBalance(genLua());if(m)w.push('Итоговый Lua: '+m+' (проверь свой код)');
  return w;
}

/* ================= ZIP и сохранение файлов ================= */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=t[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0;};})();
function makeZip(files){
  const enc=new TextEncoder(),parts=[],cen=[];let off=0;
  for(const f of files){const nm=enc.encode(f.path),crc=CRC(f.data),sz=f.data.length;
    const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(10,0,true);lh.setUint16(12,0x21,true);lh.setUint32(14,crc,true);lh.setUint32(18,sz,true);lh.setUint32(22,sz,true);lh.setUint16(26,nm.length,true);
    parts.push(new Uint8Array(lh.buffer),nm,f.data);
    const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(14,0x21,true);ch.setUint32(16,crc,true);ch.setUint32(20,sz,true);ch.setUint32(24,sz,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
    cen.push(new Uint8Array(ch.buffer),nm);off+=30+nm.length+sz;}
  let cs=0;cen.forEach(p=>cs+=p.length);
  const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  const all=[...parts,...cen,new Uint8Array(e.buffer)];let tot=0;all.forEach(p=>tot+=p.length);const out=new Uint8Array(tot);let o=0;all.forEach(p=>{out.set(p,o);o+=p.length;});return out;
}
function dataUrlBytes(u){const b=atob(u.split(',')[1]);const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function bytesB64(b){let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s);}
async function saveBytes(fileName,bytes,mime){
  const cap=window.Capacitor;
  if(cap&&cap.isNativePlatform&&cap.isNativePlatform()&&cap.Plugins&&cap.Plugins.Filesystem){
    const{Filesystem,Share}=cap.Plugins,b64=bytesB64(bytes);
    try{await Filesystem.writeFile({path:'PEStageEditor/'+fileName,data:b64,directory:'DOCUMENTS',recursive:true});toast('Сохранено: Documents/PEStageEditor/'+fileName);}catch(e){toast('Documents недоступны, открою «Поделиться»');}
    try{const r=await Filesystem.writeFile({path:fileName,data:b64,directory:'CACHE'});if(Share)await Share.share({title:fileName,files:[r.uri]});}catch(e){}
    return;
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bytes],{type:mime||'application/octet-stream'}));a.download=fileName;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);
}
function collectFiles(base){
  const enc=new TextEncoder(),sn=slug(P.name),files=[];
  files.push({path:base+'stages/'+sn+'.json',data:enc.encode(genJson())},{path:base+'stages/'+sn+'.lua',data:enc.encode(genLua())});
  const used=new Set(P.objects.filter(o=>o.type==='image'&&o.image&&P.images[o.image]).map(o=>o.image));
  used.forEach(n=>{const d=P.images[n];files.push({path:base+'images/'+sn+'/'+n,data:dataUrlBytes(d.data)});if(d.xml)files.push({path:base+'images/'+sn+'/'+noExt(n)+'.xml',data:enc.encode(d.xml)});});
  const usedSnd=new Set();P.events.forEach(e=>e.actions.forEach(a=>{if(a.type==='sound'&&P.sounds[a.sound])usedSnd.add(a.sound);}));
  usedSnd.forEach(n=>files.push({path:base+'sounds/'+sn+'/'+n,data:dataUrlBytes(P.sounds[n].data)}));
  ACTLIB.filter(x=>x.chart&&x.code.trim()).forEach(x=>{let nm=String(x.name).replace(/[^A-Za-z0-9_ \-]+/g,'').trim();if(!nm)nm='CustomEvent'+String(x.id).slice(-4);files.push({path:base+'custom_events/'+nm+'.lua',data:enc.encode(chartEventLua(x,nm))},{path:base+'custom_events/'+nm+'.txt',data:enc.encode(chartEventTxt(x))});});

}

async function loadProject(d){

  SEL=null;commit();resetSim();fit();
  const rep=['Готово: '+r.objs.length+' объектов, '+r.evs.length+' событий анимации ('+({vslice:'V-Slice',codename:'Codename'}[norm.fmt])+' → Psych 0.7.3). Картинок привязано: '+r.matched+'.'];
  if(missing.size)rep.push('⚠ Нет картинок: '+[...missing].join(', ')+'. Добавь их кнопкой «Картинки и атласы» (PNG + XML), они привяжутся сами.');
  notes.forEach(n=>rep.push('⚠ '+n));
  CV.report=rep;renderPanel();toast('Конвертация завершена');
}
async function loadAssets(files){
  const list=[...files],xmls=list.filter(f=>/\.xml$/i.test(f.name)),imgs=list.filter(f=>/\.(png|jpe?g|webp|gif)$/i.test(f.name));let n=0;
  for(const f of imgs){const name=cleanName(f.name),data=await readFile(f);P.images[name]={data,w:0,h:0,xml:(P.images[name]||{}).xml||null};
    const x=xmls.find(z=>noExt(cleanName(z.name))===noExt(name));if(x)P.images[name].xml=await readFile(x,'text');await prepImage(name);n++;}
  for(const x of xmls){const b=noExt(cleanName(x.name)),k=Object.keys(P.images).find(i=>noExt(i)===b);
    if(k&&!imgs.some(f=>noExt(cleanName(f.name))===b)){P.images[k].xml=await readFile(x,'text');await prepImage(k);}}
  return n;
}
function cvRelink(){
  let n=0;
  P.objects.forEach(o=>{if(o.type!=='image'||o.image||!o.srcAsset)return;const k=findImage(o.srcAsset);if(!k)return;o.image=k;n++;
    const ci=IMG[k];if(o.autoAnim&&ci&&ci.prefixes.length&&!o.anims.length){o.animated=true;o.anims=ci.prefixes.slice(0,40).map(mkAnim);delete o.autoAnim;}});
  commit();invalidate();CV.report=(CV.report||[]).concat(['Привязано картинок: '+n]);renderPanel();toast('Привязано картинок: '+n);
}
function tabImport(){
  const T='cv',fn={vslice:'V-Slice (JSON)',codename:'Codename Engine (XML)',psych:'Psych Engine (уже готов, конвертация не нужна)'};
  let h=`<div class="grp"><h3>🔄 Конвертер локаций → Psych Engine</h3><div class="hint">Поддерживается: V-Slice (stage .json) и Codename Engine (stage .xml). Картинки и XML-атласы можно добавить до или после конвертации: они привязываются по имени файла.</div>
  <div class="row"><button class="pri" data-a="cvFile">📂 Файл локации</button><button data-a="cvImgs">🖼 Картинки и атласы</button></div>`;
  h+=CV.file?`<div class="hint">Файл: <b>${esc(CV.file)}</b> · формат: <b>${CV.fmt?fn[CV.fmt]:'не распознан'}</b> · картинок в проекте: ${Object.keys(P.images).length}</div>`:`<div class="hint">Файл не выбран.</div>`;
  h+=selF(T,'mode',CV.mode,[['replace','заменить текущую сцену'],['append','добавить к текущей сцене']],'Как применить');
  if(CV.fmt==='vslice')h+=`<div class="hint">V-Slice ставит персонажей по «ногам», Psych по левому верхнему углу. Для пересчёта нужен размер кадра персонажа (по умолчанию как у стандартной сцены).</div>`+['bf','dad','gf'].map(k=>`<div class="two">${num(T,'sizes.'+k+'.0',CV.sizes[k][0],CH[k].n+': ширина кадра')}${num(T,'sizes.'+k+'.1',CV.sizes[k][1],CH[k].n+': высота кадра')}</div>`).join('');
  h+=`<div class="row"><button class="pri" data-a="cvRun" ${CV.fmt==='vslice'||CV.fmt==='codename'?'':'disabled'}>Конвертировать</button><button data-a="cvRelink">🔗 Привязать картинки</button></div></div>`;
  if(CV.report&&CV.report.length)h+=`<div class="grp"><h3>Отчёт</h3>${CV.report.map(x=>`<div class="${x[0]==='⚠'?'warn':'hint'}">${esc(x)}</div>`).join('')}</div>`;
  return h;
}
$('#fCv').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;const t=await readFile(f,'text');CV.file=f.name;CV.text=t;CV.fmt=cvDetect(t);CV.report=[];renderPanel();toast(CV.fmt?'Формат распознан':'Формат не распознан');});
$('#fCvImg').addEventListener('change',async e=>{if(!e.target.files.length)return;const n=await loadAssets(e.target.files);toast('Картинок добавлено: '+n);cvRelink();});

(async function init(){
  let d=null;try{const s=await dbGet('proj');if(s)d=JSON.parse(s);}catch(e){}
  await loadLib();await loadActLib();await loadTarget();
  await loadProject(d||demo());
  resize();fit();requestAnimationFrame(loop);
})();
</script>

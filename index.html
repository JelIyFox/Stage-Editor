<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Psych Stage Editor</title>
<style>
:root{--bg:#f3f1f8;--sf:#fff;--tx:#1b1630;--mu:#6b6585;--ln:#d9d4ea;--ac:#6a3df0;--act:#fff;--ck1:#e6e2f2;--ck2:#fafaff;--dg:#d02a3c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14101f;--sf:#1f1930;--tx:#f0ecfb;--mu:#a69fc0;--ln:#352c52;--ac:#9a7bff;--act:#14101f;--ck1:#2a2340;--ck2:#1f1930;--dg:#ff6b7a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14101f;--sf:#1f1930;--tx:#f0ecfb;--mu:#a69fc0;--ln:#352c52;--ac:#9a7bff;--act:#14101f;--ck1:#2a2340;--ck2:#1f1930;--dg:#ff6b7a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 "Trebuchet MS",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:12px}
h1{font-size:1.3rem;margin:0 0 8px}
h2{font-size:1rem;margin:0 0 8px}
section{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:12px}
button,.btn,select{font:inherit;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:10px;padding:8px 12px;min-height:42px}
button.p,.btn.p{background:var(--ac);color:var(--act);border-color:var(--ac);font-weight:700}
button.d{color:var(--dg);border-color:var(--dg)}
button.sm{min-height:36px;padding:4px 10px}
button.on{border-color:var(--ac);background:var(--ck1)}
input[type=text],input[type=number],textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:6px 8px;min-height:40px;width:100%}
textarea{font:12px/1.35 ui-monospace,monospace;min-height:160px}
select{width:100%}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.hint{color:var(--mu);font-size:.85rem}
#cw{position:relative;border:1px solid var(--ln);border-radius:10px;overflow:hidden;background:var(--ck2);height:min(48vh,380px);touch-action:none}
#cv{width:100%;height:100%;display:block;touch-action:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px}
label.f{display:flex;flex-direction:column;gap:2px;font-size:.8rem;color:var(--mu)}
label.f input,label.f select{color:var(--tx)}
label.c{display:flex;gap:8px;align-items:center;margin-bottom:6px}
label.c input{width:22px;height:22px}
.cd{border:1px solid var(--ln);border-radius:10px;padding:8px;margin-bottom:8px}
.cd.sel{border-color:var(--ac);background:var(--ck1)}
.ol{max-height:220px;overflow-y:auto;overscroll-behavior:contain;margin-bottom:8px}
.ol .cd{display:flex;gap:6px;align-items:center;padding:4px 6px;margin-bottom:4px}
.ol .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;border:none;background:none;min-height:36px;padding:0 4px}
.evl{max-height:55vh;overflow-y:auto;overscroll-behavior:contain}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.8rem;padding:3px 10px;border-radius:99px;border:1px solid var(--ln);color:var(--mu)}
#toast{position:fixed;left:50%;transform:translateX(-50%);width:max-content;max-width:90vw;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;text-align:center}
#toast.on{opacity:1}
</style>
</head>
<body>
<main>
<h1>Psych Stage Editor</h1>
<div class="row">
<button id="newp">Новый</button>
<label class="btn">Открыть<input id="openf" type="file" hidden></label>
<button class="p" id="savep">Сохранить проект</button>
</div>

<section id="modsec">
<div class="row"><button class="p" id="modpick">Выбрать папку мода</button><span class="hint" id="modinfo">Мод не выбран</span></div>
<div id="modui" style="display:none">
<select id="stsel"></select>
<select id="sgsel"></select>
<select id="chsel" style="display:none"></select>
<div class="row"><select id="vmode" style="width:auto"><option value="edit">Вид: редактор</option><option value="game">Вид: как в игре</option></select><select id="camsel" style="width:auto"><option value="auto">Камера: авто</option><option value="dad">Камера: оппонент</option><option value="bf">Камера: игрок</option><option value="gf">Камера: GF</option></select><label class="c" style="margin:0"><input type="checkbox" id="shnotes" checked><span>Ноты</span></label></div>
<div class="hint" id="songinfo"></div>
</div>
</section>
<section id="fb" style="display:none">
<h2>Выбор папки мода</h2>
<div class="hint" id="fbp" style="word-break:break-all;margin-bottom:6px"></div>
<div class="ol" id="fbl"></div>
<div class="row"><button id="fbup">Назад</button><button class="p" id="fbok">Выбрать эту папку</button><button id="fbno">Отмена</button></div>
</section>
<section>
<div id="cw"><canvas id="cv"></canvas></div>
<div class="row" style="margin-top:8px">
<button class="sm" id="zin">＋</button><button class="sm" id="zout">－</button><button class="sm" id="zfit">По размеру</button>
<label class="c" style="margin:0"><input type="checkbox" id="sgrid" checked><span>Сетка</span></label>
<label class="c" style="margin:0"><input type="checkbox" id="scam"><span>Камера</span></label>
</div>
<div class="row" id="scrub" style="display:none">
<button class="sm" id="splay">▶</button>
<input type="range" id="sst" min="0" max="64" value="0" style="flex:1;min-width:140px">
<span class="hint" id="sinf">Шаг 0</span>
</div>
</section>

<div class="row" id="tabs">
<button class="p sm" data-t="0">Объекты</button><button class="sm" data-t="1">Персонажи</button><button class="sm" data-t="2">Уровни и степы</button><button class="sm" data-t="3">Экспорт</button>
</div>

<section id="t0">
<div class="row"><label class="btn p">＋ Картинки<input id="addimg" type="file" multiple hidden></label><button id="addgfx">＋ Цветной блок</button></div>
<div class="ol" id="olist"></div>
<div id="oprop"></div>
</section>

<section id="t1" style="display:none"></section>

<section id="t2" style="display:none">
<div class="row"><select id="lsel" style="flex:1;min-width:140px"></select><button class="sm" id="ladd">＋</button><button class="sm" id="lren">Имя</button><button class="sm d" id="ldel">✕</button></div>
<div id="lbody"></div>
</section>

<section id="t3" style="display:none">
<div class="row"><button class="p" id="xgen">Обновить</button><button id="xzip">Сохранить ZIP</button></div>
<div id="modsave" style="display:none"><div class="row"><input type="text" id="xname" placeholder="Имя файлов в stages/" style="flex:1;min-width:140px"><button class="p" id="xsave">Сохранить в мод</button></div>
<label class="c"><input type="checkbox" id="xover"><span>Перезаписать оригинальные файлы локации</span></label></div>
<h2>JSON сцены</h2>
<textarea id="xjson" spellcheck="false"></textarea>
<div class="row" style="margin-top:6px"><button class="sm" id="cj">Копировать JSON</button></div>
<h2>Lua</h2>
<textarea id="xlua" spellcheck="false" style="min-height:260px"></textarea>
<div class="row" style="margin-top:6px"><button class="sm" id="cl">Копировать Lua</button></div>
<h2>Импорт</h2>
<div class="row"><label class="btn">Файл .lua или .json сцены<input id="impf" type="file" hidden></label></div>
<div class="hint" id="impi"></div>
</section>
</main>
<div id="toast"></div>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var tt;function toast(t){var e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){e.classList.remove('on')},2600)}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function clone(o){return JSON.parse(JSON.stringify(o))}
function num(v){v=+v;if(!isFinite(v))return '0';return String(Math.round(v*10000)/10000)}
function qs(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
function slug(s){return String(s).replace(/\.[^.]+$/,'').replace(/[^\w]+/g,'_').replace(/^_+|_+$/g,'')||'obj'}

/* ================= project ================= */
var uidc=0,IM={},P,sel=null,curL=0,step=0,playing=false,tab=0,lastT=0;
function newProject(){
 return{name:'mystage',dir:'',zoom:0.9,pixel:false,hideGF:false,camSpeed:1,
  bf:{x:770,y:100,cx:0,cy:0,img:''},dad:{x:100,y:100,cx:0,cy:0,img:''},gf:{x:400,y:130,cx:0,cy:0,img:''},
  objs:[],levels:[]}
}
P=newProject();
function objById(id){for(var i=0;i<P.objs.length;i++)if(P.objs[i].id===id)return P.objs[i];return null}
function newObj(type){
 return{id:'o'+(++uidc),tag:'obj'+uidc,type:type||'sprite',anim:false,img:'',src:'',x:0,y:0,sx:1,sy:1,ang:0,a:1,scx:1,scy:1,fx:false,fy:false,aa:true,front:false,vis:true,col:'',blend:'',w:300,h:200,gc:'FFFFFF',extra:''}
}
function uniqTag(t,except){var base=t,n=1,ok;do{ok=true;P.objs.forEach(function(o){if(o!==except&&o.tag===t)ok=false});if(!ok)t=base+(++n)}while(!ok);return t}
function objSize(o){
 if(o.type==='graphic')return[o.w,o.h];
 var m=IM[o.src];if(m&&m.frame)return[m.frame.fw,m.frame.fh];if(m)return[m.img.naturalWidth,m.img.naturalHeight];return[200,200]
}

/* ================= image library ================= */
function addFiles(fl,after){
 var left=fl.length,made=[];if(!left)return;
 [].forEach.call(fl,function(f){
  var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){IM[f.name]={img:im,url:r.result};made.push(f.name);if(--left===0){after(made);redraw()}};im.onerror=function(){if(--left===0)after(made)};im.src=r.result};r.readAsDataURL(f)
 })
}
$('addimg').addEventListener('change',function(e){
 var fl=[].slice.call(e.target.files);e.target.value='';
 addFiles(fl,function(names){
  names.sort(function(a,b){return a.localeCompare(b,undefined,{numeric:true})}).forEach(function(n){
   var o=newObj('sprite');o.src=n;o.img=slug(n)==='obj'?n.replace(/\.[^.]+$/,''):n.replace(/\.[^.]+$/,'');o.tag=uniqTag(slug(n),null);
   var s=objSize(o);o.x=Math.round(view.cx-s[0]/2);o.y=Math.round(view.cy-s[1]/2);P.objs.push(o);sel=o.id});
  renderObjs();toast('Добавлено картинок: '+names.length)})
});
$('addgfx').addEventListener('click',function(){var o=newObj('graphic');o.tag=uniqTag('block',null);o.x=Math.round(view.cx-o.w/2);o.y=Math.round(view.cy-o.h/2);o.gc='7755CC';P.objs.push(o);sel=o.id;renderObjs();redraw()});

/* ================= view & drawing ================= */
var cv=$('cv'),ctx=cv.getContext('2d'),view={cx:640,cy:360,s:0.4},CW=300,CH=300,dpr=window.devicePixelRatio||1,pend=false;
var CHS={bf:{n:'BF',c:'#3a7bd5',w:300,h:400},dad:{n:'Оппонент',c:'#9b59b6',w:300,h:400},gf:{n:'GF',c:'#e67e9b',w:300,h:350}};
function resize(){var r=$('cw').getBoundingClientRect();CW=Math.max(100,r.width);CH=Math.max(100,r.height);cv.width=Math.round(CW*dpr);cv.height=Math.round(CH*dpr);redraw()}
function fit(){var b=[0,0,1280,720];P.objs.forEach(function(o){var s=objSize(o);b[0]=Math.min(b[0],o.x);b[1]=Math.min(b[1],o.y);b[2]=Math.max(b[2],o.x+s[0]);b[3]=Math.max(b[3],o.y+s[1])});['bf','dad','gf'].forEach(function(k){b[0]=Math.min(b[0],P[k].x);b[1]=Math.min(b[1],P[k].y);b[2]=Math.max(b[2],P[k].x+CHS[k].w);b[3]=Math.max(b[3],P[k].y+CHS[k].h)});
 b[0]=Math.max(b[0],-1500);b[1]=Math.max(b[1],-1500);b[2]=Math.min(b[2],3500);b[3]=Math.min(b[3],3000);
 view.cx=(b[0]+b[2])/2;view.cy=(b[1]+b[3])/2;view.s=Math.min(CW/(b[2]-b[0]+80),CH/(b[3]-b[1]+80));redraw()}
function redraw(){if(pend)return;pend=true;requestAnimationFrame(function(){pend=false;draw()})}
function charBox(k){if(CHR[k])return chBox(k);var c=P[k],m=c.img&&IM[c.img];return m?[c.x,c.y,m.img.naturalWidth,m.img.naturalHeight]:[c.x,c.y,CHS[k].w,CHS[k].h]}

/* preview state of objects at a given step */
var EASE={linear:function(t){return t},sineIn:function(t){return 1-Math.cos(t*Math.PI/2)},sineOut:function(t){return Math.sin(t*Math.PI/2)},sineInOut:function(t){return -(Math.cos(Math.PI*t)-1)/2},
 quadIn:function(t){return t*t},quadOut:function(t){return 1-(1-t)*(1-t)},quadInOut:function(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2},
 cubeIn:function(t){return t*t*t},cubeOut:function(t){return 1-Math.pow(1-t,3)},cubeInOut:function(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2},
 quartOut:function(t){return 1-Math.pow(1-t,4)},expoOut:function(t){return t>=1?1:1-Math.pow(2,-10*t)},backOut:function(t){var c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)},
 bounceOut:function(t){var n=7.5625,d=2.75;if(t<1/d)return n*t*t;if(t<2/d)return n*(t-=1.5/d)*t+.75;if(t<2.5/d)return n*(t-=2.25/d)*t+.9375;return n*(t-=2.625/d)*t+.984375}};
var EASES=['linear','sineIn','sineOut','sineInOut','quadIn','quadOut','quadInOut','cubeIn','cubeOut','cubeInOut','quartOut','expoOut','backOut','bounceOut'];
function stepSec(L){return 60/Math.max(1,L.bpm||100)/4}
function evalState(S){
 var st={},zoom=P.zoom,L=P.levels[curL];
 P.objs.forEach(function(o){st[o.id]={x:o.x,y:o.y,a:o.a,ang:o.ang,sx:o.sx,sy:o.sy}});
 if(!L||S<=0)return{st:st,zoom:zoom};
 var ss=stepSec(L),evs=L.ev.map(function(e,i){return{e:e,i:i}}).sort(function(a,b){return a.e.step-b.e.step||a.i-b.i});
 evs.forEach(function(q){var e=q.e;if(e.step>S)return;
  if(e.act==='zoom'){if(e.dur>0){var p=Math.min(1,(S-e.step)/(e.dur/ss));zoom=zoom+(e.v-zoom)*(EASE[e.ease]||EASE.linear)(p)}else zoom=e.v;return}
  var o=objById(e.obj);if(!o||!st[o.id])return;var s=st[o.id];
  if(e.act==='set'){for(var k in e.p)s[k]=e.p[k]}
  else if(e.act==='tween'){var p2=e.dur>0?Math.min(1,(S-e.step)/(e.dur/ss)):1,f=(EASE[e.ease]||EASE.linear)(p2);for(var k2 in e.p)s[k2]=s[k2]+(e.p[k2]-s[k2])*f}
 });
 return{st:st,zoom:zoom}
}

function drawObj(o,s){
 var z=objSize(o),w=z[0],h=z[1];
 ctx.save();ctx.globalAlpha=Math.max(0,Math.min(1,s.a))*(o.vis?1:0.25);
 if(o.blend)ctx.globalCompositeOperation=({add:'lighter',multiply:'multiply',screen:'screen',lighten:'lighten',darken:'darken'})[o.blend]||'source-over';
 ctx.translate(s.x+w/2,s.y+h/2);ctx.rotate(s.ang*Math.PI/180);ctx.scale(s.sx*(o.fx?-1:1),s.sy*(o.fy?-1:1));
 if(o.type==='graphic'){ctx.fillStyle='#'+(o.gc||'FFFFFF');ctx.fillRect(-w/2,-h/2,w,h)}
 else{var m=IM[o.src];if(m&&m.frame){var fr=m.frame;ctx.drawImage(m.img,fr.x,fr.y,fr.w,fr.h,-w/2-fr.fx,-h/2-fr.fy,fr.w,fr.h)}else if(m)ctx.drawImage(m.img,-w/2,-h/2,w,h);else{ctx.fillStyle='rgba(120,100,200,.25)';ctx.fillRect(-w/2,-h/2,w,h);ctx.strokeStyle='#8a78d8';ctx.setLineDash([12,8]);ctx.lineWidth=3;ctx.strokeRect(-w/2,-h/2,w,h);ctx.setLineDash([]);ctx.fillStyle='#8a78d8';ctx.font='28px sans-serif';ctx.fillText(o.img||o.tag,-w/2+10,0)}}
 ctx.restore()
}
function draw(){
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,CW,CH);
 var dk=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;ctx.fillStyle=dk?'#18132a':'#ece9f6';ctx.fillRect(0,0,CW,CH);
 var E=evalState(step);
 if(vmode==='game'){gameDraw(E);return}
 ctx.save();ctx.translate(CW/2,CH/2);ctx.scale(view.s,view.s);ctx.translate(-view.cx,-view.cy);
 var lw=1/view.s;
 if($('sgrid').checked){ctx.strokeStyle=dk?'rgba(255,255,255,.08)':'rgba(0,0,0,.08)';ctx.lineWidth=lw;var g=100,x0=Math.floor((view.cx-CW/2/view.s)/g)*g,x1=view.cx+CW/2/view.s,y0=Math.floor((view.cy-CH/2/view.s)/g)*g,y1=view.cy+CH/2/view.s;
  ctx.beginPath();for(var x=x0;x<=x1;x+=g){ctx.moveTo(x,y0);ctx.lineTo(x,y1)}for(var y=y0;y<=y1;y+=g){ctx.moveTo(x0,y);ctx.lineTo(x1,y)}ctx.stroke()}
 ctx.strokeStyle='#e0a030';ctx.lineWidth=2*lw;ctx.strokeRect(0,0,1280,720);
 P.objs.filter(function(o){return !o.front}).forEach(function(o){drawObj(o,E.st[o.id])});
 ['gf','dad','bf'].forEach(function(k){if(k==='gf'&&P.hideGF)return;if(CHR[k]){drawChar(k);return}var b=charBox(k),m=P[k].img&&IM[P[k].img];
  if(m)ctx.drawImage(m.img,b[0],b[1]);else{ctx.fillStyle=CHS[k].c+'88';ctx.fillRect(b[0],b[1],b[2],b[3]);ctx.strokeStyle=CHS[k].c;ctx.lineWidth=3*lw;ctx.strokeRect(b[0],b[1],b[2],b[3]);ctx.fillStyle=CHS[k].c;ctx.font=(28*1)+'px sans-serif';ctx.fillText(CHS[k].n,b[0]+10,b[1]+34)}});
 P.objs.filter(function(o){return o.front}).forEach(function(o){drawObj(o,E.st[o.id])});
 if(sel){ctx.lineWidth=3*lw;ctx.strokeStyle='#ff4d6a';
  if(sel==='bf'||sel==='dad'||sel==='gf'){var b2=charBox(sel);ctx.strokeRect(b2[0],b2[1],b2[2],b2[3])}
  else{var o2=objById(sel);if(o2){var s2=E.st[o2.id],z=objSize(o2);ctx.save();ctx.translate(s2.x+z[0]/2,s2.y+z[1]/2);ctx.rotate(s2.ang*Math.PI/180);ctx.scale(s2.sx,s2.sy);ctx.lineWidth=3*lw/Math.max(.01,Math.abs(s2.sx));ctx.strokeRect(-z[0]/2,-z[1]/2,z[0],z[1]);ctx.restore()}}}
 if($('scam').checked){var bb=charBox('bf'),dd=charBox('dad'),cx=((bb[0]+bb[2]/2)+(dd[0]+dd[2]/2))/2,cy=((bb[1]+bb[3]/2)+(dd[1]+dd[3]/2))/2,zw=1280/E.zoom,zh=720/E.zoom;
  ctx.strokeStyle='#2fbf71';ctx.lineWidth=2*lw;ctx.setLineDash([14*lw,8*lw]);ctx.strokeRect(cx-zw/2,cy-zh/2,zw,zh);ctx.setLineDash([])}
 ctx.restore()
}

/* ================= pointer interaction ================= */
var ptrs={},drag=null,pinch=null;
function toWorld(px,py){return[(px-CW/2)/view.s+view.cx,(py-CH/2)/view.s+view.cy]}
function hitObj(o,wx,wy,E){var s=E.st[o.id],z=objSize(o),dx=wx-(s.x+z[0]/2),dy=wy-(s.y+z[1]/2),a=-s.ang*Math.PI/180,lx=(dx*Math.cos(a)-dy*Math.sin(a))/(s.sx||1),ly=(dx*Math.sin(a)+dy*Math.cos(a))/(s.sy||1);return Math.abs(lx)<=z[0]/2&&Math.abs(ly)<=z[1]/2}
function hit(wx,wy){
 var E=evalState(step),i,o;
 if(sel==='bf'||sel==='dad'||sel==='gf'){var sb=charBox(sel);if(wx>=sb[0]&&wx<=sb[0]+sb[2]&&wy>=sb[1]&&wy<=sb[1]+sb[3])return sel}

 (S.notes||[]).forEach(function(sec){var len=sec.lengthInSteps||16;if(sec.changeBPM&&sec.bpm){bpm=sec.bpm;segs.push({step:st,time:tm,bpm:bpm})}
  secs.push({step:st,time:tm,must:!!sec.mustHitSection});
  (sec.sectionNotes||[]).forEach(function(n){notes.push({t:n[0],lane:n[1]%4,pl:sec.mustHitSection?(n[1]<4):(n[1]>=4),sus:n[2]||0})});
  tm+=len*15000/bpm;st+=len});
 var evs=[];(S.events||[]).forEach(function(e){(e[1]||[]).forEach(function(x){evs.push({t:e[0],name:x[0],v1:x[1],v2:x[2]})})});
 notes.sort(function(a,b){return a.t-b.t});
 SONG={name:name,segs:segs,secs:secs,notes:notes,events:evs,totalSteps:Math.max(64,Math.ceil(st)),speed:S.speed||1,p1:S.player1,p2:S.player2,p3:S.gfVersion||S.player3||'gf',stage:S.stage,audio:null};
 var L=null;P.levels.forEach(function(l){if(String(l.name).toLowerCase()===name.toLowerCase())L=l});if(!L){L={name:name,bpm:Math.round(segs[0].bpm),ev:[]};P.levels.push(L)}L.bpm=Math.round(segs[0].bpm);curL=P.levels.indexOf(L);step=0;
 if(SONG.stage&&MOD.stages.indexOf(SONG.stage)>=0&&P.name!==SONG.stage){await loadStage(SONG.stage)}
 await loadChars();
 vmode='game';$('vmode').value='game';camWho='auto';$('camsel').value='auto';
 $('songinfo').textContent=name+': BPM '+Math.round(segs[0].bpm)+(segs.length>1?' (меняется)':'')+', нот '+notes.length+', событий чарта '+evs.length+'. Персонажи: '+[SONG.p1,SONG.p2,SONG.p3].join(', ')+(SONG.stage?'. Локация: '+SONG.stage:'');
 loadAudio(name);setStep(0);showTab(tab);redraw()
}
function stopAudio(){if(SONG&&SONG.audio){try{SONG.audio.pause()}catch(e){}}playing=false;$('splay').textContent='▶'}
async function loadAudio(name){
 var tries=[name,name.toLowerCase().replace(/\s+/g,'-')];
 for(var i=0;i<tries.length;i++){var b=await rb64(jp(MOD.dir,'songs',tries[i],'Inst.ogg')).catch(function(){return null});
  if(b){var s=atob(b),u=new Uint8Array(s.length);for(var q=0;q<s.length;q++)u[q]=s.charCodeAt(q);var a=new Audio(URL.createObjectURL(new Blob([u],{type:'audio/ogg'})));a.preload='auto';if(SONG&&SONG.name===name)SONG.audio=a;return}}
}

/* camera and game view */
function camCenter(){
 var k=camWho==='auto'?(SONG?(mustAt(step)?'bf':'dad'):'dad'):camWho,h=CHR[k],b=h?chBox(k):charBox(k),mx,my;
 if(h){var fw=h.cv.width*h.scale,fh=h.cv.height*h.scale;mx=P[k].x+h.pos[0]+fw/2;my=P[k].y+h.pos[1]+fh/2}else{mx=b[0]+b[2]/2;my=b[1]+b[3]/2}
 var off=k==='dad'?[150,-100]:k==='bf'?[-100,-100]:[0,0],cp=h?h.cam:[0,0];
 return{x:mx+off[0]+cp[0]+P[k].cx,y:my+off[1]+cp[1]+P[k].cy}
}
var LC=['#c24b99','#00d8ff','#12fa05','#f9393f'];
function drawHud(){
 if(!$('shnotes').checked||!SONG)return;
 var tms=timeAtStep(step),px=0.45*SONG.speed,sy=60,x0=[92,732],i;
 for(var side=0;side<2;side++)for(i=0;i<4;i++){ctx.strokeStyle=LC[i];ctx.globalAlpha=.6;ctx.lineWidth=5;ctx.strokeRect(x0[side]+112*i,sy,100,100);ctx.globalAlpha=1}
 var lo=tms-300,hi=tms+720/px;
 SONG.notes.forEach(function(n){if(n.t<lo||n.t>hi)return;var x=x0[n.pl?1:0]+112*n.lane,y=sy+(n.t-tms)*px;
  if(n.sus>0){ctx.fillStyle=LC[n.lane];ctx.globalAlpha=.6;ctx.fillRect(x+35,y+50,30,n.sus*px);ctx.globalAlpha=1}
  ctx.fillStyle=LC[n.lane];ctx.fillRect(x+4,y+4,92,92);ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.strokeRect(x+4,y+4,92,92)});
 ctx.fillStyle='#222';ctx.fillRect(340,650,600,18);ctx.fillStyle='#4cd964';ctx.fillRect(640,650,300,18);ctx.fillStyle='#ff3b30';ctx.fillRect(340,650,300,18);
 var ev=null;SONG.events.forEach(function(e){if(e.t<=tms&&tms-e.t<1500)ev=e});
 if(ev){ctx.fillStyle='#fff';ctx.font='24px sans-serif';ctx.fillText('Событие: '+ev.name+(ev.v1?' ('+ev.v1+(ev.v2?', '+ev.v2:'')+')':''),20,700)}
}
function gameDraw(E){
 var sc=Math.min(CW/1280,CH/720),ox=(CW-1280*sc)/2,oy=(CH-720*sc)/2;
 ctx.fillStyle='#000';ctx.fillRect(0,0,CW,CH);
 ctx.save();ctx.translate(ox,oy);ctx.scale(sc,sc);ctx.beginPath();ctx.rect(0,0,1280,720);ctx.clip();ctx.fillStyle='#101010';ctx.fillRect(0,0,1280,720);
 var c=camCenter(),z=E.zoom;
 function inWorld(fn){ctx.save();ctx.translate(640,360);ctx.scale(z,z);ctx.translate(-c.x,-c.y);fn();ctx.restore()}
 function par(o){var s=E.st[o.id];return{x:s.x+(c.x-640)*(1-o.scx),y:s.y+(c.y-360)*(1-o.scy),a:s.a,ang:s.ang,sx:s.sx,sy:s.sy}}
 inWorld(function(){
  P.objs.filter(function(o){return !o.front}).forEach(function(o){drawObj(o,par(o))});
  ['gf','dad','bf'].forEach(function(k){if(k==='gf'&&P.hideGF)return;if(CHR[k]){if(k==='gf'){ctx.save();ctx.translate((c.x-640)*.05,(c.y-360)*.05);drawChar(k);ctx.restore()}else drawChar(k)}});
  P.objs.filter(function(o){return o.front}).forEach(function(o){drawObj(o,par(o))})});
 drawHud();
 ctx.restore()
}
/* save into mod */
$('xsave').onclick=async function(){
 if(!MOD){toast('Сначала выбери мод');return}gen();
 var nm=$('xname').value.replace(/[^\w\-]/g,'_')||((P.name||'stage')+'_edit');
 if($('xover').checked){nm=P.name;if(!confirm('Перезаписать оригинальные файлы stages/'+nm+'.json и .lua? Логика из исходного Lua, которую редактор не понимает, пропадёт.'))return}
 try{await FS.writeFile({path:jp(MOD.dir,'stages',nm+'.json'),data:$('xjson').value,directory:DIR,encoding:'utf8',recursive:true});
  await FS.writeFile({path:jp(MOD.dir,'stages',nm+'.lua'),data:$('xlua').value,directory:DIR,encoding:'utf8',recursive:true});
  toast('Сохранено: '+ROOT+jp(MOD.dir,'stages')+'/'+nm+'.json и .lua')}catch(e){toast('Не удалось записать в мод (нужен доступ ко всем файлам)')}
};

window.__stage={CH:function(){return CHR},cam:function(){return camCenter()},P:function(){return P},IM:function(){return IM},gen:gen,importText:importText};
window.addEventListener('resize',resize);
new ResizeObserver(resize).observe($('cw'));
resize();fit();showTab(0);
})();
</script>
